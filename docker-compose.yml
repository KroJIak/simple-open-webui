services:
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: simple-open-webui:custom-main
    container_name: open-webui
    volumes:
    - open-webui:/app/backend/data
    ports:
    - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
    - WEBUI_NAME=${WEBUI_NAME}
    - DEFAULT_LOCALE=${DEFAULT_LOCALE}
    - USER_AGENT=${USER_AGENT}
    - DEFAULT_PROMPT_SUGGESTIONS=${DEFAULT_PROMPT_SUGGESTIONS}
    - ENABLE_PROMPT_SUGGESTIONS=${ENABLE_PROMPT_SUGGESTIONS}
    - ENABLE_CHANNELS=${ENABLE_CHANNELS}
    - ENABLE_PUBLIC_ACTIVE_USERS_COUNT=${ENABLE_PUBLIC_ACTIVE_USERS_COUNT}
    - ENABLE_OLLAMA_API=${ENABLE_OLLAMA_API}
    - ENABLE_EVALUATION_ARENA_MODELS=${ENABLE_EVALUATION_ARENA_MODELS}
    - ENABLE_FOLLOW_UP_GENERATION=${ENABLE_FOLLOW_UP_GENERATION}
    - ENABLE_TAGS_GENERATION=${ENABLE_TAGS_GENERATION}
    - ENABLE_MEMORIES=${ENABLE_MEMORIES}
    - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
    - AUDIO_STT_ENGINE=${AUDIO_STT_ENGINE}
    - AUDIO_TTS_ENGINE=${AUDIO_TTS_ENGINE}
    - ENABLE_CALENDAR=${ENABLE_CALENDAR}
    - ENABLE_AUTOMATIONS=${ENABLE_AUTOMATIONS}
    - ENABLE_CODE_EXECUTION=${ENABLE_CODE_EXECUTION}
    - ENABLE_CODE_INTERPRETER=${ENABLE_CODE_INTERPRETER}
    - CODE_INTERPRETER_ENGINE=${CODE_INTERPRETER_ENGINE}
    - ENABLE_ADMIN_CHAT_ACCESS=${ENABLE_ADMIN_CHAT_ACCESS}
    - ENABLE_ADMIN_EXPORT=${ENABLE_ADMIN_EXPORT}
    - USER_PERMISSIONS_CHAT_CALL=${USER_PERMISSIONS_CHAT_CALL}
    - ENABLE_IMAGE_GENERATION=${ENABLE_IMAGE_GENERATION}
    - IMAGE_GENERATION_ENGINE=${IMAGE_GENERATION_ENGINE}
    - IMAGE_GENERATION_MODEL=${IMAGE_GENERATION_MODEL}
    - IMAGE_SIZE=${IMAGE_SIZE}
    - ENABLE_IMAGE_PROMPT_GENERATION=${ENABLE_IMAGE_PROMPT_GENERATION}
    - IMAGES_OPENAI_API_BASE_URL=${IMAGES_OPENAI_API_BASE_URL}
    - IMAGES_OPENAI_API_KEY=${IMAGES_OPENAI_API_KEY}
    - ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH}
    - ENABLE_NATIVE_PROVIDER_WEB_SEARCH=${ENABLE_NATIVE_PROVIDER_WEB_SEARCH}
    - WEB_SEARCH_ENGINE=${WEB_SEARCH_ENGINE}
    - DDGS_BACKEND=${DDGS_BACKEND}
    - WEB_SEARCH_RESULT_COUNT=${WEB_SEARCH_RESULT_COUNT}
    - WEB_SEARCH_CONCURRENT_REQUESTS=${WEB_SEARCH_CONCURRENT_REQUESTS}
    - ENABLE_BASE_MODELS_CACHE=${ENABLE_BASE_MODELS_CACHE}
    - HIDE_NEW_MODELS_BY_DEFAULT=${HIDE_NEW_MODELS_BY_DEFAULT}
    - AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST=${AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST}
    - AIOHTTP_CLIENT_READ_BUFSIZE=${AIOHTTP_CLIENT_READ_BUFSIZE}
    - AIOHTTP_CLIENT_MAX_LINE_SIZE=${AIOHTTP_CLIENT_MAX_LINE_SIZE}
    - AIOHTTP_CLIENT_MAX_FIELD_SIZE=${AIOHTTP_CLIENT_MAX_FIELD_SIZE}
    - BYPASS_WEB_SEARCH_WEB_LOADER=${BYPASS_WEB_SEARCH_WEB_LOADER}
    - BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL=${BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL}
    - WEB_LOADER_TIMEOUT=${WEB_LOADER_TIMEOUT}
    - ENABLE_SEARCH_QUERY_GENERATION=${ENABLE_SEARCH_QUERY_GENERATION}
    - DATABASE_URL=${DATABASE_URL}
    - USER_PERMISSIONS_WORKSPACE_MODELS_ACCESS=${USER_PERMISSIONS_WORKSPACE_MODELS_ACCESS}
    - USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS=${USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS}
    - USER_PERMISSIONS_WORKSPACE_PROMPTS_ACCESS=${USER_PERMISSIONS_WORKSPACE_PROMPTS_ACCESS}
    - USER_PERMISSIONS_WORKSPACE_SKILLS_ACCESS=${USER_PERMISSIONS_WORKSPACE_SKILLS_ACCESS}
    - USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS=${USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS}
    - USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS=${USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS}
    - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  open-webui: {}
